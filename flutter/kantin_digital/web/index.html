<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Kantin Digital">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kantin_digital">
  <meta name="application-name" content="kantin_digital">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>kantin_digital</title>
  <link rel="manifest" href="/app-manifest.json">
</head>

<body>
  <script>
    (function() {
      try {
        var host = window.location.hostname;
        var parts = host.split('.');
        var sub = '';
        if (parts.length >= 3 && !['www', 'kasirdigital', 'ekasir', 'api', 'admin'].includes(parts[0])) {
          sub = parts[0];
        }
        var mLink = document.querySelector('link[rel="manifest"]');
        if (mLink) {
          mLink.href = '/app-manifest.json' + (sub ? '?tenant=' + encodeURIComponent(sub) : '');
        }
      } catch (e) {}
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/flutter_service_worker.js', { scope: '/' }).catch(function() {
        return navigator.serviceWorker.register('/sw.js', { scope: '/' });
      }).catch(function(err) {
        console.warn('SW registration failed:', err);
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          if (name.indexOf('flutter') !== -1) {
            caches.delete(name);
          }
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.v2.js" async></script>
</body>

</html>
